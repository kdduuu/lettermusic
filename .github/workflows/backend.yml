name: Backend - Testes

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lettermusic_ci
          POSTGRES_PASSWORD: senha_descartavel_ci
          POSTGRES_DB: lettermusic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lettermusic_ci -d lettermusic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: lettermusic_test
      DB_USER: lettermusic_ci
      DB_PASSWORD: senha_descartavel_ci
      JWT_SECRET: chave-descartavel-de-testes-do-lettermusic-ci-2026
      LETTERMUSIC_TEST_DATABASE_URL: postgresql+psycopg://lettermusic_ci:senha_descartavel_ci@localhost:5432/lettermusic_test

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validar migracoes Alembic no banco descartavel
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Executar testes unitarios e PostgreSQL real
        run: python -m pytest backend/tests -q
